<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarkov アイテム管理</title>
<style>
:root{--bg:#1b1d1a;--panel:#25282a;--line:#3a3e3a;--tx:#d9d4c3;--mu:#8c8a7d;--ac:#c2a96a;--bad:#d0634c;--ok:#86ab80;--sell:#6fa3c0;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#ecebe4;--panel:#f8f7f2;--line:#cfccbd;--tx:#25262a;--mu:#6d6b5f;--ac:#7d6a2c;--bad:#b4402b;--ok:#4a7a44;--sell:#2f6f94;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans JP","Hiragino Sans",Meiryo,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mu);padding:6px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--ac);color:#1b1d1a;font-weight:700}
button.p,select,input[type=search]{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button.p{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#stat{color:var(--mu);font-size:12px;margin-left:auto}
main{padding:14px;max-width:1100px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.note{color:var(--mu);font-size:12px;margin:0 0 12px}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{padding:8px 12px;cursor:pointer;font-weight:700;display:flex;gap:8px}
summary span{color:var(--mu);font-weight:400}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-top:1px solid var(--line)}
.row label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.row.done{opacity:.5}
.row input[type=checkbox]{margin-top:4px;accent-color:var(--ac);width:16px;height:16px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mu);margin-left:6px}
.tag.k{color:var(--ac);border-color:var(--ac)}
.mats{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mu);font-weight:400;position:sticky;top:53px;background:var(--panel)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td img{width:36px;height:36px;object-fit:contain;display:block;background:#0003;border-radius:4px}
td input[type=number]{width:62px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font:inherit}
.st{font-weight:700;white-space:nowrap}
.st.bad{color:var(--bad)}.st.eq{color:var(--ac)}.st.ok{color:var(--sell)}
.fir{color:var(--bad);font-size:11px;display:block}
.hide{display:none}
#msg{padding:30px;text-align:center;color:var(--mu)}
@media (max-width:640px){.c-hide{display:none}th{top:90px}}
</style>
</head>
<body>
<header>
  <h1>Tarkov アイテム管理</h1>
  <div class="seg" id="mode"><button data-m="regular">PvP</button><button data-m="pve">PvE</button></div>
  <div class="seg" id="tabs"><button data-t="items">アイテム</button><button data-t="tasks">タスク</button><button data-t="hideout">ハイドアウト</button></div>
  <button class="p" id="reload">データ再取得</button>
  <span id="stat"></span>
</header>
<main><div id="msg">読み込み中…</div><div id="view"></div></main>

<script>
const API='https://api.tarkov.dev/graphql', TTL=12*3600e3;
const ITEM='item{id name shortName iconLink basePrice sellFor{priceRUB vendor{name}}}';
const Q=(m)=>`{tasks(lang:ja,gameMode:${m}){id name kappaRequired lightkeeperRequired minPlayerLevel trader{name}
objectives{type ... on TaskObjectiveItem{${ITEM} count foundInRaid}}}
hideoutStations(lang:ja,gameMode:${m}){id name levels{id level itemRequirements{${ITEM} count}}}}`;

const S={mode:load('mode','regular'),tab:load('tab','items'),data:null,st:null,q:'',flt:'all',kappa:false,hideDone:false};
function load(k,d){try{const v=localStorage.getItem('tkv:'+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem('tkv:'+k,JSON.stringify(v))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>n?n.toLocaleString()+'₽':'-';

async function fetchData(force){
  const key='data:'+S.mode, c=load(key,null);
  if(!force&&c&&Date.now()-c.t<TTL)return c;
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:Q(S.mode)})});
  const j=await r.json();
  if(!j.data)throw new Error(JSON.stringify(j.errors||j).slice(0,200));
  const d={t:Date.now(),tasks:j.data.tasks,stations:j.data.hideoutStations};
  save(key,d);return d;
}
async function boot(force){
  $('#msg').textContent='読み込み中…';$('#msg').classList.remove('hide');$('#view').innerHTML='';
  S.st=load('state:'+S.mode,{tasks:{},hideout:{},have:{}});
  try{
    S.data=await fetchData(force);
    prep();
    $('#msg').classList.add('hide');render();
    $('#stat').textContent='データ取得: '+new Date(S.data.t).toLocaleString('ja-JP');
  }catch(e){
    const old=load('data:'+S.mode,null);
    if(old){S.data=old;prep();$('#msg').classList.add('hide');render();$('#stat').textContent='取得失敗・古いキャッシュを表示中';}
    else $('#msg').textContent='取得に失敗しました: '+e.message+'（ネット接続を確認して「データ再取得」を押してください）';
  }
}

/* 必要数の集計用に、タスクごと・レベルごとの素材リストを作る */
function prep(){
  S.data.tasks.forEach(t=>{
    const m={};
    (t.objectives||[]).forEach(o=>{
      if(!o.item||!(o.type==='giveItem'||o.type==='findItem'))return;
      const k=o.item.id+(o.foundInRaid?':f':':n');
      // 「探す」と「渡す」の二重計上を避けるため、同一アイテムは多い方を採用
      const cur=m[o.item.id]||(m[o.item.id]={item:o.item,count:0,fir:false});
      cur.count=Math.max(cur.count,o.count);cur.fir=cur.fir||!!o.foundInRaid;
    });
    t._mats=Object.values(m);
  });
}
function sellBest(it){
  let best=0,v='';
  (it.sellFor||[]).forEach(s=>{if(s.vendor.name!=='Flea Market'&&s.priceRUB>best){best=s.priceRUB;v=s.vendor.name}});
  return {price:best||it.basePrice||0,vendor:v};
}
function needs(){
  const N={};
  const add=(it,n,fir,src)=>{
    const r=N[it.id]||(N[it.id]={item:it,task:0,taskFir:0,hide:0,total:0,left:0});
    return r;
  };
  const all={};
  const touch=(it)=>all[it.id]||(all[it.id]={item:it,need:0,fir:0,seen:true});
  S.data.tasks.forEach(t=>t._mats.forEach(m=>{
    const r=touch(m.item);
    if(!S.st.tasks[t.id]){r.need+=m.count;if(m.fir)r.fir+=m.count}
  }));
  S.data.stations.forEach(s=>s.levels.forEach(l=>(l.itemRequirements||[]).forEach(q=>{
    const r=touch(q.item);
    if(!S.st.hideout[l.id])r.need+=q.count;
  })));
  return Object.values(all);
}

function render(){
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  ({items:rItems,tasks:rTasks,hideout:rHide})[S.tab]();
}

function rItems(){
  const rows=needs().map(r=>{
    const h=S.st.have[r.item.id]||{n:0,f:0};
    r.have=h.n;r.haveF=h.f;r.diff=h.n-r.need;
    r.state=r.diff<0?'bad':(r.diff===0&&r.need>0?'eq':'ok');
    return r;
  });
  const q=S.q.toLowerCase();
  let list=rows.filter(r=>(!q||(r.item.name+r.item.shortName).toLowerCase().includes(q))&&(S.flt==='all'||r.state===S.flt));
  list.sort((a,b)=>(b.need>0)-(a.need>0)||a.item.name.localeCompare(b.item.name,'ja'));
  const cnt=k=>rows.filter(r=>r.state===k).length;
  $('#view').innerHTML=`
  <p class="note">未クリアのタスク・ハイドアウトの必要数を合算しています。「探す」と「渡す」が両方あるタスクは二重計上せず多い方を採用。所持数は入力すると自動保存されます。</p>
  <div class="bar"><input type="search" id="q" placeholder="アイテム名で検索" value="${esc(S.q)}">
  <select id="flt"><option value="all">すべて (${rows.length})</option><option value="bad">不足 (${cnt('bad')})</option><option value="eq">ちょうど (${cnt('eq')})</option><option value="ok">売却可 (${cnt('ok')})</option></select></div>
  <table><thead><tr><th></th><th>アイテム</th><th class="n">必要</th><th>所持</th><th>FIR所持</th><th>判定</th><th class="c-hide">売値(最高)</th></tr></thead><tbody>
  ${list.map(r=>{const sb=sellBest(r.item);
    const label=r.state==='bad'?`不足 ${-r.diff}`:r.state==='eq'?'ちょうど':(r.need===0?'売却可（全数）':`売却可 +${r.diff}`);
    const firWarn=r.fir>0&&r.haveF<r.fir?`<span class="fir">FIR あと${r.fir-r.haveF}</span>`:'';
    return `<tr><td><img src="${esc(r.item.iconLink||'')}" alt="" loading="lazy"></td><td>${esc(r.item.name)}</td>
    <td class="n">${r.need}${r.fir?`<span class="mats"> (FIR ${r.fir})</span>`:''}</td>
    <td><input type="number" min="0" data-id="${r.item.id}" data-k="n" value="${r.have}"></td>
    <td><input type="number" min="0" data-id="${r.item.id}" data-k="f" value="${r.haveF}">${firWarn}</td>
    <td class="st ${r.state}">${label}</td><td class="c-hide mats">${yen(sb.price)} ${esc(sb.vendor)}</td></tr>`}).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu)">該当するアイテムがありません</td></tr>'}
  </tbody></table>`;
  $('#q').oninput=e=>{S.q=e.target.value;rItems();const el=$('#q');el.focus();el.setSelectionRange(99,99)};
  $('#flt').value=S.flt;$('#flt').onchange=e=>{S.flt=e.target.value;rItems()};
  document.querySelectorAll('td input[type=number]').forEach(i=>i.onchange=e=>{
    const id=i.dataset.id,h=S.st.have[id]||(S.st.have[id]={n:0,f:0});
    h[i.dataset.k]=Math.max(0,parseInt(i.value)||0);
    if(i.dataset.k==='f'&&h.f>h.n)h.n=h.f;
    save('state:'+S.mode,S.st);rItems();
  });
}

function rTasks(){
  const q=S.q.toLowerCase(),by={};
  S.data.tasks.forEach(t=>{
    if(q&&!t.name.toLowerCase().includes(q)&&!t.trader.name.toLowerCase().includes(q))return;
    if(S.kappa&&!t.kappaRequired)return;
    if(S.hideDone&&S.st.tasks[t.id])return;
    (by[t.trader.name]=by[t.trader.name]||[]).push(t);
  });
  const total=S.data.tasks.length,done=S.data.tasks.filter(t=>S.st.tasks[t.id]).length;
  $('#view').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="タスク名・トレーダーで検索" value="${esc(S.q)}">
  <label><input type="checkbox" id="kp" ${S.kappa?'checked':''}> Kappa必須のみ</label>
  <label><input type="checkbox" id="hd" ${S.hideDone?'checked':''}> クリア済みを隠す</label>
  <span class="mats">クリア済み ${done} / ${total}</span></div>`+
  Object.keys(by).sort((a,b)=>a.localeCompare(b)).map(tr=>`<details ${q||Object.keys(by).length===1?'open':''}><summary>${esc(tr)}<span>${by[tr].filter(t=>S.st.tasks[t.id]).length} / ${by[tr].length}</span></summary>
  ${by[tr].sort((a,b)=>a.minPlayerLevel-b.minPlayerLevel).map(t=>`<div class="row ${S.st.tasks[t.id]?'done':''}"><label><input type="checkbox" data-id="${t.id}" ${S.st.tasks[t.id]?'checked':''}>
  <div>${esc(t.name)}<span class="tag">Lv${t.minPlayerLevel}</span>${t.kappaRequired?'<span class="tag k">Kappa</span>':''}
  <div class="mats">${t._mats.length?t._mats.map(m=>esc(m.item.shortName)+'×'+m.count+(m.fir?'(FIR)':'')).join(' / '):'アイテム納品なし'}</div></div></label></div>`).join('')}</details>`).join('');
  $('#q').oninput=e=>{S.q=e.target.value;rTasks();const el=$('#q');el.focus();el.setSelectionRange(99,99)};
  $('#kp').onchange=e=>{S.kappa=e.target.checked;rTasks()};
  $('#hd').onchange=e=>{S.hideDone=e.target.checked;rTasks()};
  const open=new Set([...document.querySelectorAll('details[open] summary')].map(s=>s.firstChild.textContent));
  document.querySelectorAll('details').forEach(d=>{if(open.has(d.querySelector('summary').firstChild.textContent))d.open=true});
  document.querySelectorAll('.row input[type=checkbox]').forEach(c=>c.onchange=()=>{
    if(c.checked)S.st.tasks[c.dataset.id]=1;else delete S.st.tasks[c.dataset.id];
    save('state:'+S.mode,S.st);
    const keep=[...document.querySelectorAll('details')].map(d=>d.open);rTasks();
    document.querySelectorAll('details').forEach((d,i)=>d.open=keep[i]);
  });
}

function rHide(){
  $('#view').innerHTML=`<p class="note">建設済みのレベルにチェックを入れてください。上位レベルにチェックすると下位レベルも自動でチェックされます。</p>`+
  S.data.stations.filter(s=>s.levels.length).map(s=>`<details open><summary>${esc(s.name)}<span>${s.levels.filter(l=>S.st.hideout[l.id]).length} / ${s.levels.length}</span></summary>
  ${s.levels.map(l=>`<div class="row ${S.st.hideout[l.id]?'done':''}"><label><input type="checkbox" data-s="${s.id}" data-id="${l.id}" ${S.st.hideout[l.id]?'checked':''}>
  <div>Lv${l.level}<div class="mats">${(l.itemRequirements||[]).length?l.itemRequirements.map(q=>esc(q.item.shortName)+'×'+q.count).join(' / '):'必要アイテムなし'}</div></div></label></div>`).join('')}</details>`).join('');
  document.querySelectorAll('.row input[type=checkbox]').forEach(c=>c.onchange=()=>{
    const st=S.data.stations.find(s=>s.id===c.dataset.s),idx=st.levels.findIndex(l=>l.id===c.dataset.id);
    st.levels.forEach((l,i)=>{
      if(c.checked&&i<=idx)S.st.hideout[l.id]=1;
      if(!c.checked&&i>=idx)delete S.st.hideout[l.id];
    });
    save('state:'+S.mode,S.st);rHide();
  });
}

document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save('mode',S.mode);S.q='';boot(false)});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save('tab',S.tab);S.q='';render()});
$('#reload').onclick=()=>boot(true);
boot(false);
</script>
</body>
</html>
